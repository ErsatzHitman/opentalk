[package]
name = "renderer_probe"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "probe_glow"

# Standalone probe: never part of the main build. One binary per renderer, each behind its own feature so
# every exe links exactly one backend and its size is comparable to the real opentalk.exe.
[workspace]

[features]
# `cargo run --release` runs the glow probe (what the real Settings window uses).
default = ["glow"]
glow = ["dep:eframe", "eframe/glow"]
wgpu = ["dep:eframe", "eframe/wgpu_no_default_features", "dep:wgpu"]
cpu = ["dep:egui-winit", "dep:winit", "dep:softbuffer"]

[dependencies]
eframe = { version = "0.36", default-features = false, optional = true }
wgpu = { version = "30", default-features = false, features = ["dx12", "std", "wgsl"], optional = true }
egui = { version = "0.36", default-features = false }
egui-winit = { version = "0.36", default-features = false, optional = true }
winit = { version = "0.30", default-features = false, features = ["rwh_06"], optional = true }
softbuffer = { version = "0.4", default-features = false, optional = true }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[[bin]]
name = "probe_glow"
path = "src/bin/glow.rs"
required-features = ["glow"]

[[bin]]
name = "probe_wgpu"
path = "src/bin/wgpu.rs"
required-features = ["wgpu"]

[[bin]]
name = "probe_cpu"
path = "src/bin/cpu.rs"
required-features = ["cpu"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
debug = false
