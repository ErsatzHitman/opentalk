[package]
name = "flac_probe"
version = "0.1.0"
edition = "2024"
publish = false

# Standalone probe: never part of the main build.
[workspace]

[dependencies]
flacenc = { version = "0.5.1", default-features = false }
claxon = "0.4.3"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Security", "Win32_Networking_WinSock"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
