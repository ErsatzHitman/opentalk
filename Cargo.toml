[package]
name = "opentalk"
version = "1.0.0"
edition = "2024"
description = "Ultra-light voice dictation for Windows: press a hotkey, talk, and clean text is pasted where your cursor is."
license = "MIT"
repository = "https://github.com/ErsatzHitman/opentalk"
readme = "README.md"
keywords = ["dictation", "speech-to-text", "windows", "whisper", "voice"]
categories = ["accessibility", "multimedia::audio"]

[dependencies]
base64 = "0.23.1"
hmac = "0.13.0"
native-tls = "0.2.18"
rsa = { version = "0.9", default-features = false, features = ["std", "pem"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tiny-skia = "0.12"
tungstenite = { version = "0.30.0", default-features = false, features = ["native-tls", "handshake"] }
ureq = { version = "2.12", default-features = false, features = ["native-tls", "json"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_Ime", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_Media_KernelStreaming", "Win32_Media_Multimedia", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_Security", "Win32_Security_Cryptography", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_Devices_FunctionDiscovery", "Win32_System_Registry", "Win32_Storage_FileSystem", "Win32_UI_HiDpi", "Win32_System_RemoteDesktop", "Win32_System_Performance", "Win32_System_WindowsProgramming", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_SystemServices", "Win32_UI_Controls", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_Accessibility", "Win32_System_Console", "Win32_Storage_Packaging_Appx", "Media_Control", "Foundation", "Foundation_Collections", "Win32_System_Time", "Win32_UI_Shell_Common", "Win32_Globalization", "Win32_System_StationsAndDesktops"] }
png = { version = "0.18", default-features = false }
windows-core = "0.62"

[build-dependencies]
embed-resource = "3"

[[example]]
name = "make_icon"
path = "tools/make_icon.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
debug = false

# Size, not speed, for code off the dictation hot path: PNG decoding (packaged app icons), Vertex
# RS256 signing, and network/JSON plumbing that waits on the network anyway. tiny-skia (pill and
# popup rendering), windows and the crate itself stay at opt-level 3 (PLAN section 1 budget).
[profile.release.package.png]
opt-level = "s"
[profile.release.package.rsa]
opt-level = "s"
[profile.release.package.num-bigint-dig]
opt-level = "s"
[profile.release.package.ureq]
opt-level = "s"
[profile.release.package.tungstenite]
opt-level = "s"
[profile.release.package.serde_json]
opt-level = "s"
[profile.release.package.url]
opt-level = "s"
[profile.release.package.idna]
opt-level = "s"
[profile.release.package.icu_normalizer]
opt-level = "s"
[profile.release.package.icu_properties]
opt-level = "s"

[profile.dev.package."*"]
opt-level = 2
