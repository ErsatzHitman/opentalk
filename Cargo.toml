[package]
name = "opentalk"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
eframe = { version = "0.36", default-features = false, features = ["glow"] }
hmac = "0.13.0"
native-tls = "0.2.18"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tiny-skia = "0.12"
tungstenite = { version = "0.30.0", default-features = false, features = ["native-tls", "handshake"] }
ureq = { version = "2.12", default-features = false, features = ["native-tls", "json"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_Media_KernelStreaming", "Win32_Media_Multimedia", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_Security", "Win32_Security_Cryptography", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_Devices_FunctionDiscovery", "Win32_System_Registry", "Win32_Storage_FileSystem", "Win32_UI_HiDpi", "Win32_System_Performance", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_SystemServices", "Win32_UI_Controls", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_Accessibility", "Win32_System_Console", "Win32_Storage_Packaging_Appx"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
debug = false

[profile.dev.package."*"]
opt-level = 2
